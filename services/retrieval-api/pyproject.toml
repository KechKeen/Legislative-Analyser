[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-api"
version = "0.1.0"
description = "API service for data retrieval"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.118",
    "uvicorn~=0.37",
    "weaviate-client~=4.17",
    "psycopg[binary]~=3.2",
    "openai~=2.0",
    "pydantic~=2.11",
    "packaging~=25.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
