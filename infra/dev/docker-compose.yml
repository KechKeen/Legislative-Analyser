name: legal-dev

volumes:
  pg_data:
  weaviate_data:

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:c3c84b85691a264aa3c5b8fc1d611e67d42b0cca8596e3d3d22dc2424c12c4e2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ADMIN_USER}
      POSTGRES_PASSWORD: ${ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - "pg_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20


  adminer:
    image: adminer:latest@sha256:3af794aede16163e72832eee3dcaf3ca87961a7d120b1a3534ff5891c5c16329
    container_name: adminer
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - postgres


  postgres-migrate:
    image: pgvector/pgvector:pg16@sha256:c3c84b85691a264aa3c5b8fc1d611e67d42b0cca8596e3d3d22dc2424c12c4e2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: >
      /bin/sh -c "
      psql "postgresql://$ADMIN_USER:$ADMIN_PASSWORD@postgres:5432/$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /migrations/0001_init.sql;
      echo \"Migration complete\";
      "
    volumes:
      - ../migrations:/migrations:ro


  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --scheme
      - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.33.0
    ports:
      - ${WEAVIATE_PORT}:8080
      - ${WEAVIATE_GRPC_PORT}:50051
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      ENABLE_MODULES: 'text2vec-openai'
      CLUSTER_HOSTNAME: 'node1'
      OPENAI_APIKEY: '${OPENAI_API_KEY}'
      TEXT2VEC_OPENAI_MODEL: 'text-embedding-3-small'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 20


  weaviate-init:
    image: curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    depends_on:
      weaviate:
        condition: service_healthy
    volumes:
      - ../weaviate/schema.json:/schema.json:ro
      - ../weaviate/obligation_schema.json:/obligation_schema.json:ro
    entrypoint: >
      /bin/sh -c "
      echo \"Waiting for Weaviate readiness...\";
      until curl --fail -s http://weaviate:8080/v1/.well-known/ready >/dev/null; do sleep 2; done;
      echo \"Applying schema.json...\";
      curl -sS -i -X POST \"http://weaviate:8080/v1/schema\" -H \"Content-Type: application/json\" --data-binary @/schema.json;
      echo \"Applying obligation_schema.json...\";
      curl -sS -i -X POST \"http://weaviate:8080/v1/schema\" -H \"Content-Type: application/json\" --data-binary @/obligation_schema.json;
      echo \"Done.\";
      "
    restart: "no"


  retrieval-api:
    build:
      context: ../../services/retrieval-api
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    environment:
      WEAVIATE_HOST: weaviate
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "${RETRIEVAL_API_PORT}:3000"
      - "${RETRIEVAL_API_DEBUG_PORT}:5678"
    volumes:
      - ../../services/retrieval-api/src:/app/src
